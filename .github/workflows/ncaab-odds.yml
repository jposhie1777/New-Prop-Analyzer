name: NCAAB odds

on:
  schedule:
    - cron: "5 12 * * *" # 7:05 AM EST / 8:05 AM EDT, the opening look
    - cron: "35 19 * * *" # 2:35 PM EST / 3:35 PM EDT
    - cron: "35 22 * * *" # 5:35 PM EST / 6:35 PM EDT, before the evening tips
  workflow_dispatch: {}

concurrency:
  group: ncaab-odds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Get saved odds, ratings and the record
        run: |
          if git ls-remote --exit-code --heads origin ncaab-odds > /dev/null; then
            git clone --depth 1 --branch ncaab-odds "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ncaab-odds
            rm -rf ncaab-odds/.git
          else
            mkdir ncaab-odds
          fi
          mkdir -p ncaab-data
          for file in ratings.json record.json; do
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ncaab-data/${file}" -o "ncaab-data/${file}" || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull odds (3 credits) and save picks
        run: npx tsx scripts/ncaab/pullOdds.ts --out ncaab-odds --data ncaab-data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          BDL_TIER: allstar

      - name: Publish as a single commit
        run: |
          cd ncaab-odds
          [ -d odds ] || exit 0
          printf '{\n  "git": { "deploymentEnabled": false },\n  "ignoreCommand": "exit 0"\n}\n' > vercel.json
          git init -b ncaab-odds
          git config user.name "pulse-ncaab-odds"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "NCAAB odds $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ncaab-odds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
